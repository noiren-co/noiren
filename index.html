
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIREN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fff;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.logo {
    position: absolute;
    top: 35px;
    width: 100%;
    text-align: center;
    font-family: "Bodoni MT", "Didot", "Times New Roman", serif;
    font-size: 34px;
    font-style: italic;
    font-weight: 400;
    letter-spacing: 5px;
}

.countdown {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(10px, 3vw, 30px);
    width: 95%;
    text-align: center;
}

.number {
    font-size: clamp(28px, 6vw, 65px);
    font-weight: 300;
    letter-spacing: 1px;
}

.unit {
    font-size: 10px;
    color: #888;
    letter-spacing: 3px;
    margin-top: 10px;
}

@media (max-width: 450px) {
    .countdown {
        gap: 12px;
    }

    .unit {
        font-size: 8px;
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>

<div class="logo">NOIREN</div>

<div class="countdown">

    <div>
        <div class="number" id="days">00</div>
        <div class="unit">GÜN</div>
    </div>

    <div>
        <div class="number" id="hours">00</div>
        <div class="unit">SAAT</div>
    </div>

    <div>
        <div class="number" id="minutes">00</div>
        <div class="unit">DAKİKA</div>
    </div>

    <div>
        <div class="number" id="seconds">00</div>
        <div class="unit">SANİYE</div>
    </div>

</div>

<script>
const target = new Date("2026-12-18T23:59:00+03:00").getTime();

function updateCountdown() {

    const now = Date.now();
    const distance = Math.max(0, target - now);

    document.getElementById("days").textContent =
        Math.floor(distance / 86400000).toString().padStart(2, "0");

    document.getElementById("hours").textContent =
        Math.floor((distance % 86400000) / 3600000).toString().padStart(2, "0");

    document.getElementById("minutes").textContent =
        Math.floor((distance % 3600000) / 60000).toString().padStart(2, "0");

    document.getElementById("seconds").textContent =
        Math.floor((distance % 60000) / 1000).toString().padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
